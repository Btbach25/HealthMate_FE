# Cấu hình cho `flutter analyze` (và cả gạch chân trong IDE).
# Xem danh sách rule tại https://dart.dev/lints.

include: package:flutter_lints/flutter.yaml

formatter:
  trailing_commas: preserve

analyzer:
  errors:
    # Log chẩn đoán trong app dùng `debugPrint` (tự cắt bớt output, tắt ở release).
    # `print()` thẳng bị coi là lỗi để không lọt vào bản release.
    avoid_print: error

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Cố tình để trống: hiện chỉ dùng bộ mặc định của flutter_lints để CI luôn xanh.
    #
    # Muốn siết thêm thì mở TỪNG rule một, mỗi rule một PR, và sửa hết vi phạm
    # trong chính PR đó. Gợi ý theo thứ tự ưu tiên:
    #   - prefer_single_quotes
    #   - always_declare_return_types
    #   - unnecessary_lambdas
    #   - unnecessary_parenthesis
    #   - avoid_dynamic_calls
    #   - public_member_api_docs      # bắt buộc doc comment cho mọi API public
    #
    # Quy ước KHÔNG bật `prefer_relative_imports`: repo này thống nhất dùng
    # import tuyệt đối `package:fe/...` ở mọi nơi.
