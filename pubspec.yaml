name: fe
description: "HealthMate — ứng dụng Flutter theo dõi sức khoẻ cá nhân và gia đình."
publish_to: 'none'

# version: <tên bản phát hành>+<build number>
# Android: build-name → versionName, build-number → versionCode.
# iOS: build-name → CFBundleShortVersionString, build-number → CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # --- Kiến trúc & state management ---
  bloc: ^8.1.4
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5              # so sánh Event/State/Model theo giá trị
  get_it: ^7.6.7                 # service locator (hiện chưa dùng — xem lib/core/di/)
  go_router: ^16.2.5             # điều hướng khai báo + auth guard

  # --- Mạng & lưu trữ ---
  http: ^1.6.0
  web_socket_channel: ^3.0.2     # nhận chỉ số sức khoẻ realtime
  shared_preferences: ^2.5.3     # token + hồ sơ người dùng ở local
  flutter_dotenv: ^5.0.2         # nạp .env dưới dạng asset (chạy được cả trên Web)
  json_annotation: ^4.9.0

  # --- Nền tảng & quyền ---
  permission_handler: ^12.0.1
  health: ^13.2.0                # Health Connect (Android) / HealthKit (iOS)
  web: ^1.1.0                    # JS interop cho nút Google Sign-In trên Web

  # --- Firebase (push notification) ---
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  google_sign_in: ^6.2.1
  google_sign_in_web: ^0.12.4

  # --- OCR đơn thuốc ---
  image_picker: ^1.1.2
  image: ^4.8.0
  google_mlkit_text_recognition: ^0.14.0   # chỉ dùng trên mobile; Web dùng Tesseract.js

  # --- UI ---
  cupertino_icons: ^1.0.8
  fl_chart: ^1.1.0               # biểu đồ chỉ số sức khoẻ
  pinput: ^5.0.2                 # ô nhập OTP
  intl: ^0.20.2                  # định dạng ngày giờ tiếng Việt

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

# `dart run flutter_launcher_icons` để sinh lại icon (hoặc `make icons`).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_logo.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# `dart run flutter_native_splash:create` để sinh lại splash (hoặc `make splash`).
flutter_native_splash:
  color: "#ffffff"
  image: assets/icons/app_logo.png
  android_12:
    image: assets/icons/app_logo.png
    color: "#ffffff"

flutter:
  uses-material-design: true

  assets:
    # `.env` KHÔNG được commit — chạy `make setup` (hoặc `cp .env.example .env`)
    # trước lần build đầu tiên, nếu không build sẽ báo thiếu asset.
    - .env
    - assets/fonts/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Italic.ttf
          style: italic
